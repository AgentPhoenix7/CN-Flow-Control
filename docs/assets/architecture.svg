<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="300" rx="16" fill="#f8fafc"/>

  <!-- Sender -->
  <g>
    <rect x="24" y="70" width="190" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="119" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Sender</text>
    <rect x="42" y="112" width="154" height="30" rx="6" fill="#dbeafe"/>
    <text x="119" y="132" text-anchor="middle" font-size="12" fill="#1e40af">Framing()</text>
    <rect x="42" y="150" width="154" height="30" rx="6" fill="#dbeafe"/>
    <text x="119" y="170" text-anchor="middle" font-size="12" fill="#1e40af">Timer / Timeout()</text>
    <rect x="42" y="188" width="154" height="30" rx="6" fill="#dbeafe"/>
    <text x="119" y="208" text-anchor="middle" font-size="12" fill="#1e40af">Send() / Recv()</text>
  </g>

  <!-- Channel -->
  <g>
    <rect x="364" y="40" width="192" height="220" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="460" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Simulated Channel</text>
    <text x="460" y="86" text-anchor="middle" font-size="11" fill="#7f1d1d">(application layer, over TCP)</text>
    <rect x="382" y="100" width="156" height="28" rx="6" fill="#fee2e2"/>
    <text x="460" y="119" text-anchor="middle" font-size="11.5" fill="#991b1b">bit corruption</text>
    <rect x="382" y="134" width="156" height="28" rx="6" fill="#fee2e2"/>
    <text x="460" y="153" text-anchor="middle" font-size="11.5" fill="#991b1b">frame loss / delay</text>
    <rect x="382" y="168" width="156" height="28" rx="6" fill="#fee2e2"/>
    <text x="460" y="187" text-anchor="middle" font-size="11.5" fill="#991b1b">CRC-16 check</text>
    <rect x="382" y="202" width="156" height="28" rx="6" fill="#fee2e2"/>
    <text x="460" y="221" text-anchor="middle" font-size="11.5" fill="#991b1b">independent seeds</text>
  </g>

  <!-- Receiver -->
  <g>
    <rect x="706" y="70" width="190" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="801" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Receiver</text>
    <rect x="724" y="112" width="154" height="30" rx="6" fill="#dcfce7"/>
    <text x="801" y="132" text-anchor="middle" font-size="12" fill="#166534">Recv()</text>
    <rect x="724" y="150" width="154" height="30" rx="6" fill="#dcfce7"/>
    <text x="801" y="170" text-anchor="middle" font-size="12" fill="#166534">Check()</text>
    <rect x="724" y="188" width="154" height="30" rx="6" fill="#dcfce7"/>
    <text x="801" y="208" text-anchor="middle" font-size="12" fill="#166534">Send() ACK/NAK</text>
  </g>

  <!-- Arrows -->
  <line x1="214" y1="120" x2="362" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288" y="112" text-anchor="middle" font-size="11" fill="#334155">DATA</text>

  <line x1="362" y1="180" x2="214" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="288" y="200" text-anchor="middle" font-size="11" fill="#7f1d1d">ACK / NAK</text>

  <line x1="558" y1="120" x2="704" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="632" y="112" text-anchor="middle" font-size="11" fill="#334155">DATA</text>

  <line x1="704" y1="180" x2="558" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="632" y="200" text-anchor="middle" font-size="11" fill="#7f1d1d">ACK / NAK</text>

  <!-- footer -->
  <text x="460" y="285" text-anchor="middle" font-size="12" fill="#64748b">
    one bidirectional TCP socket carries both DATA and ACK — protocol logic (Stop-and-Wait / Go-Back-N / Selective Repeat) lives entirely above it
  </text>
</svg>
