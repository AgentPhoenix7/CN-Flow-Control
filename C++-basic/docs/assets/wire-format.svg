<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="340" rx="16" fill="#f8fafc"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">DATA frame — 15-byte header + 46-byte payload + 2-byte CRC-16</text>

  <!-- header + payload + crc row: field widths sized to fit their labels, not to scale -->
  <g transform="translate(24,80)">
    <!-- header bracket: src MAC + dst MAC + length + seq = 6+6+2+1 = 15 B (tag is external TCP framing, not part of it) -->
    <text x="205" y="-20" text-anchor="middle" font-size="11" fill="#475569">15-byte header</text>
    <line x1="50" y1="-8" x2="360" y2="-8" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="-8" x2="50" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="360" y1="-8" x2="360" y2="0" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- tag -->
    <rect x="0" y="0" width="50" height="64" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="25" y="30" text-anchor="middle" font-size="11" fill="#334155">tag</text>
    <text x="25" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">1 B</text>

    <!-- src mac -->
    <rect x="50" y="0" width="90" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" font-size="11" fill="#1e40af">src MAC</text>
    <text x="95" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">6 B</text>

    <!-- dst mac -->
    <rect x="140" y="0" width="90" height="64" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="185" y="30" text-anchor="middle" font-size="11" fill="#3730a3">dst MAC</text>
    <text x="185" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">6 B</text>

    <!-- length -->
    <rect x="230" y="0" width="70" height="64" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="265" y="30" text-anchor="middle" font-size="11" fill="#92400e">length</text>
    <text x="265" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">2 B</text>

    <!-- seq -->
    <rect x="300" y="0" width="60" height="64" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="330" y="30" text-anchor="middle" font-size="11" fill="#78350f">seq</text>
    <text x="330" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">1 B</text>

    <!-- payload -->
    <rect x="360" y="0" width="220" height="64" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="470" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">payload</text>
    <text x="470" y="46" text-anchor="middle" font-size="9.5" fill="#64748b">46 B fixed</text>

    <!-- crc -->
    <rect x="580" y="0" width="90" height="64" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="625" y="30" text-anchor="middle" font-size="11" fill="#991b1b">CRC-16</text>
    <text x="625" y="45" text-anchor="middle" font-size="9.5" fill="#64748b">2 B</text>
  </g>

  <!-- control messages -->
  <g transform="translate(24,194)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#0f172a">Control messages</text>
    <text x="0" y="18" font-size="10.5" fill="#64748b">framed by a 1-byte tag + fixed body length, outside the simulated frame</text>

    <!-- ACK -->
    <rect x="0" y="34" width="230" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="115" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">ACK</text>
    <text x="115" y="68" text-anchor="middle" font-size="10" fill="#78350f" font-family="monospace">[0x02][seq][seq]</text>

    <!-- DONE -->
    <rect x="255" y="34" width="185" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="347" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">DONE</text>
    <text x="347" y="68" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="monospace">[0x03]</text>

    <!-- DONE_ACK -->
    <rect x="465" y="34" width="205" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="567" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">DONE_ACK</text>
    <text x="567" y="68" text-anchor="middle" font-size="10" fill="#14532d" font-family="monospace">[0x04]</text>

    <text x="0" y="108" font-size="10.5" fill="#64748b">seq is repeated in the ACK body so a single corrupted bit is</text>
    <text x="0" y="123" font-size="10.5" fill="#64748b">detectable without a full CRC on the ACK path</text>
  </g>
</svg>
