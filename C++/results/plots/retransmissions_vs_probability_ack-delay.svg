<circle cx="736" cy="89.92" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__ack-delay__0.5" data-protocol="stop-and-wait" data-probability="0.5" data-metric="retransmissions" data-value="91"><title>Stop-and-Wait at 0.5: 91</title></circle>
<polyline points="96,352 224,352 352,352 480,352 608,352 736,352" fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 4"/>
<circle cx="96" cy="352" r="4" fill="#c2410c" data-run="go-back-n__none" data-protocol="go-back-n" data-probability="0.0" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.0: 0</title></circle>
<circle cx="224" cy="352" r="4" fill="#c2410c" data-run="go-back-n__ack-delay__0.1" data-protocol="go-back-n" data-probability="0.1" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.1: 0</title></circle>
<circle cx="352" cy="352" r="4" fill="#c2410c" data-run="go-back-n__ack-delay__0.2" data-protocol="go-back-n" data-probability="0.2" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.2: 0</title></circle>
<circle cx="480" cy="352" r="4" fill="#c2410c" data-run="go-back-n__ack-delay__0.3" data-protocol="go-back-n" data-probability="0.3" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.3: 0</title></circle>
<circle cx="608" cy="352" r="4" fill="#c2410c" data-run="go-back-n__ack-delay__0.4" data-protocol="go-back-n" data-probability="0.4" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.4: 0</title></circle>
<circle cx="736" cy="352" r="4" fill="#c2410c" data-run="go-back-n__ack-delay__0.5" data-protocol="go-back-n" data-probability="0.5" data-metric="retransmissions" data-value="0"><title>Go-Back-N at 0.5: 0</title></circle>
<polyline points="96,352 224,326.08 352,288.64 480,259.84 608,219.52 736,89.92" fill="none" stroke="#2f7d32" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 3"/>
<circle cx="96" cy="352" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__none" data-protocol="selective-repeat" data-probability="0.0" data-metric="retransmissions" data-value="0"><title>Selective Repeat at 0.0: 0</title></circle>
<circle cx="224" cy="326.08" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-delay__0.1" data-protocol="selective-repeat" data-probability="0.1" data-metric="retransmissions" data-value="9"><title>Selective Repeat at 0.1: 9</title></circle>
<circle cx="352" cy="288.64" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-delay__0.2" data-protocol="selective-repeat" data-probability="0.2" data-metric="retransmissions" data-value="22"><title>Selective Repeat at 0.2: 22</title></circle>
<circle cx="480" cy="259.84" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-delay__0.3" data-protocol="selective-repeat" data-probability="0.3" data-metric="retransmissions" data-value="32"><title>Selective Repeat at 0.3: 32</title></circle>
<circle cx="608" cy="219.52" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-delay__0.4" data-protocol="selective-repeat" data-probability="0.4" data-metric="retransmissions" data-value="46"><title>Selective Repeat at 0.4: 46</title></circle>
<circle cx="736" cy="89.92" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-delay__0.5" data-protocol="selective-repeat" data-probability="0.5" data-metric="retransmissions" data-value="91"><title>Selective Repeat at 0.5: 91</title></circle>
<line x1="96" y1="434" x2="118" y2="434" stroke="#1b6ca8" stroke-width="2" stroke-dasharray="none"/>
