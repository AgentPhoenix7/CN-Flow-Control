<text x="86" y="176" text-anchor="end" font-size="11" fill="#5b6670">500</text>
<line x1="96" y1="136" x2="736" y2="136" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="140" text-anchor="end" font-size="11" fill="#5b6670">600</text>
