<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img">
<title>Retransmitted data frames versus DATA-path excessive delay (loss)</title>
<desc>Three ARQ protocols compared as the data-path excessive delay (loss) probability rises from 0.0 to 0.5, all other impairment paths held at zero. Source: results/experiments.csv.</desc>
