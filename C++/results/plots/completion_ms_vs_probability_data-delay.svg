<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img">
<title>Completion time versus DATA-path excessive delay (loss)</title>
<desc>Three ARQ protocols compared as the data-path excessive delay (loss) probability rises from 0.0 to 0.5, all other impairment paths held at zero. Source: results/experiments.csv.</desc>
<rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2933">
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold">Completion time versus DATA-path excessive delay (loss)</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#5b6670">CRC-16, 46-byte payload, 4096-byte input, window 8, seed 20260831</text>
<line x1="96" y1="352" x2="736" y2="352" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="356" text-anchor="end" font-size="11" fill="#5b6670">10</text>
<line x1="96" y1="280" x2="736" y2="280" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="284" text-anchor="end" font-size="11" fill="#5b6670">100</text>
<line x1="96" y1="208" x2="736" y2="208" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="212" text-anchor="end" font-size="11" fill="#5b6670">1000</text>
<line x1="96" y1="136" x2="736" y2="136" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="140" text-anchor="end" font-size="11" fill="#5b6670">10000</text>
<line x1="96" y1="64" x2="736" y2="64" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="68" text-anchor="end" font-size="11" fill="#5b6670">100000</text>
<line x1="96" y1="64" x2="96" y2="352" stroke="#1f2933" stroke-width="1.5"/>
<line x1="96" y1="352" x2="736" y2="352" stroke="#1f2933" stroke-width="1.5"/>
<line x1="96" y1="352" x2="96" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="96" y="372" text-anchor="middle" font-size="11">0.0</text>
<text x="96" y="385" text-anchor="middle" font-size="10" fill="#5b6670">(none)</text>
<line x1="224" y1="352" x2="224" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="224" y="372" text-anchor="middle" font-size="11">0.1</text>
<line x1="352" y1="352" x2="352" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="352" y="372" text-anchor="middle" font-size="11">0.2</text>
<line x1="480" y1="352" x2="480" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="480" y="372" text-anchor="middle" font-size="11">0.3</text>
<line x1="608" y1="352" x2="608" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="608" y="372" text-anchor="middle" font-size="11">0.4</text>
<line x1="736" y1="352" x2="736" y2="357" stroke="#1f2933" stroke-width="1"/>
<text x="736" y="372" text-anchor="middle" font-size="11">0.5</text>
<text x="416" y="408" text-anchor="middle" font-size="12">DATA-path excessive delay (loss) probability</text>
<text transform="translate(22 208) rotate(-90)" text-anchor="middle" font-size="12">Completion time (ms, logarithmic)</text>
<polyline points="96,282.949 224,258.17 352,241.368 480,225.304 608,213.008 736,199.58" fill="none" stroke="#1b6ca8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="none"/>
<circle cx="96" cy="282.949" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__none" data-protocol="stop-and-wait" data-probability="0.0" data-metric="completion_ms" data-value="91"><title>Stop-and-Wait at 0.0: 91</title></circle>
<circle cx="224" cy="258.17" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.1" data-protocol="stop-and-wait" data-probability="0.1" data-metric="completion_ms" data-value="201"><title>Stop-and-Wait at 0.1: 201</title></circle>
<circle cx="352" cy="241.368" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.2" data-protocol="stop-and-wait" data-probability="0.2" data-metric="completion_ms" data-value="344"><title>Stop-and-Wait at 0.2: 344</title></circle>
<circle cx="480" cy="225.304" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.3" data-protocol="stop-and-wait" data-probability="0.3" data-metric="completion_ms" data-value="575"><title>Stop-and-Wait at 0.3: 575</title></circle>
<circle cx="608" cy="213.008" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.4" data-protocol="stop-and-wait" data-probability="0.4" data-metric="completion_ms" data-value="852"><title>Stop-and-Wait at 0.4: 852</title></circle>
<circle cx="736" cy="199.58" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.5" data-protocol="stop-and-wait" data-probability="0.5" data-metric="completion_ms" data-value="1309"><title>Stop-and-Wait at 0.5: 1309</title></circle>
<polyline points="96,343.796 224,275.091 352,252.495 480,223.508 608,144.092 736,134.308" fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 4"/>
<circle cx="96" cy="343.796" r="4" fill="#c2410c" data-run="go-back-n__none" data-protocol="go-back-n" data-probability="0.0" data-metric="completion_ms" data-value="13"><title>Go-Back-N at 0.0: 13</title></circle>
<circle cx="224" cy="275.091" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.1" data-protocol="go-back-n" data-probability="0.1" data-metric="completion_ms" data-value="117"><title>Go-Back-N at 0.1: 117</title></circle>
<circle cx="352" cy="252.495" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.2" data-protocol="go-back-n" data-probability="0.2" data-metric="completion_ms" data-value="241"><title>Go-Back-N at 0.2: 241</title></circle>
<circle cx="480" cy="223.508" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.3" data-protocol="go-back-n" data-probability="0.3" data-metric="completion_ms" data-value="609"><title>Go-Back-N at 0.3: 609</title></circle>
<circle cx="608" cy="144.092" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.4" data-protocol="go-back-n" data-probability="0.4" data-metric="completion_ms" data-value="7720"><title>Go-Back-N at 0.4: 7720</title></circle>
<circle cx="736" cy="134.308" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.5" data-protocol="go-back-n" data-probability="0.5" data-metric="completion_ms" data-value="10556"><title>Go-Back-N at 0.5: 10556</title></circle>
<polyline points="96,343.796 224,280.632 352,267.953 480,253.55 608,250.852 736,242.857" fill="none" stroke="#2f7d32" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 3"/>
<circle cx="96" cy="343.796" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__none" data-protocol="selective-repeat" data-probability="0.0" data-metric="completion_ms" data-value="13"><title>Selective Repeat at 0.0: 13</title></circle>
<circle cx="224" cy="280.632" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__data-delay__0.1" data-protocol="selective-repeat" data-probability="0.1" data-metric="completion_ms" data-value="98"><title>Selective Repeat at 0.1: 98</title></circle>
<circle cx="352" cy="267.953" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__data-delay__0.2" data-protocol="selective-repeat" data-probability="0.2" data-metric="completion_ms" data-value="147"><title>Selective Repeat at 0.2: 147</title></circle>
<circle cx="480" cy="253.55" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__data-delay__0.3" data-protocol="selective-repeat" data-probability="0.3" data-metric="completion_ms" data-value="233"><title>Selective Repeat at 0.3: 233</title></circle>
<circle cx="608" cy="250.852" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__data-delay__0.4" data-protocol="selective-repeat" data-probability="0.4" data-metric="completion_ms" data-value="254"><title>Selective Repeat at 0.4: 254</title></circle>
<circle cx="736" cy="242.857" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__data-delay__0.5" data-protocol="selective-repeat" data-probability="0.5" data-metric="completion_ms" data-value="328"><title>Selective Repeat at 0.5: 328</title></circle>
<line x1="96" y1="434" x2="118" y2="434" stroke="#1b6ca8" stroke-width="2" stroke-dasharray="none"/>
<circle cx="107" cy="434" r="4.5" fill="#1b6ca8"/>
<text x="125" y="438" font-size="12">Stop-and-Wait</text>
<line x1="286" y1="434" x2="308" y2="434" stroke="#c2410c" stroke-width="2" stroke-dasharray="8 4"/>
<circle cx="297" cy="434" r="4" fill="#c2410c"/>
<text x="315" y="438" font-size="12">Go-Back-N</text>
<line x1="476" y1="434" x2="498" y2="434" stroke="#2f7d32" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="487" cy="434" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2"/>
<text x="505" y="438" font-size="12">Selective Repeat</text>
</g>
