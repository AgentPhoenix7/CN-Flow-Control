<circle cx="224" cy="112.152" r="4" fill="#c2410c" data-run="go-back-n__ack-error__0.1" data-protocol="go-back-n" data-probability="0.1" data-metric="goodput_bytes_per_second" data-value="315076.923077"><title>Go-Back-N at 0.1: 315076.923077</title></circle>
<circle cx="352" cy="112.152" r="4" fill="#c2410c" data-run="go-back-n__ack-error__0.2" data-protocol="go-back-n" data-probability="0.2" data-metric="goodput_bytes_per_second" data-value="315076.923077"><title>Go-Back-N at 0.2: 315076.923077</title></circle>
<circle cx="480" cy="115.242" r="4" fill="#c2410c" data-run="go-back-n__ack-error__0.3" data-protocol="go-back-n" data-probability="0.3" data-metric="goodput_bytes_per_second" data-value="292571.428571"><title>Go-Back-N at 0.3: 292571.428571</title></circle>
<circle cx="608" cy="115.242" r="4" fill="#c2410c" data-run="go-back-n__ack-error__0.4" data-protocol="go-back-n" data-probability="0.4" data-metric="goodput_bytes_per_second" data-value="292571.428571"><title>Go-Back-N at 0.4: 292571.428571</title></circle>
<circle cx="736" cy="115.242" r="4" fill="#c2410c" data-run="go-back-n__ack-error__0.5" data-protocol="go-back-n" data-probability="0.5" data-metric="goodput_bytes_per_second" data-value="292571.428571"><title>Go-Back-N at 0.5: 292571.428571</title></circle>
<polyline points="96,112.152 224,185.772 352,208.789 480,217.327 608,232.3 736,255.837" fill="none" stroke="#2f7d32" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 3"/>
<circle cx="96" cy="112.152" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__none" data-protocol="selective-repeat" data-probability="0.0" data-metric="goodput_bytes_per_second" data-value="315076.923077"><title>Selective Repeat at 0.0: 315076.923077</title></circle>
<circle cx="224" cy="185.772" r="7.5" fill="none" stroke="#2f7d32" stroke-width="2.2" data-run="selective-repeat__ack-error__0.1" data-protocol="selective-repeat" data-probability="0.1" data-metric="goodput_bytes_per_second" data-value="53894.736842"><title>Selective Repeat at 0.1: 53894.736842</title></circle>
