<circle cx="736" cy="322.044" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.5" data-protocol="go-back-n" data-probability="0.5" data-metric="efficiency" data-value="0.072810"><title>Go-Back-N at 0.5: 0.072810</title></circle>
