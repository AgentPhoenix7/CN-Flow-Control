<circle cx="480" cy="297.82" r="4" fill="#c2410c" data-run="go-back-n__data-delay__0.3" data-protocol="go-back-n" data-probability="0.3" data-metric="efficiency" data-value="0.131687"><title>Go-Back-N at 0.3: 0.131687</title></circle>
