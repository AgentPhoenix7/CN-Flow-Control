<circle cx="736" cy="195.265" r="4.5" fill="#1b6ca8" data-run="stop-and-wait__data-delay__0.5" data-protocol="stop-and-wait" data-probability="0.5" data-metric="efficiency" data-value="0.380952"><title>Stop-and-Wait at 0.5: 0.380952</title></circle>
<polyline points="96,64 224,189.46 352,240.897 480,297.82 608,312.404 736,322.044" fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 4"/>
