<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img">
<title>Efficiency versus DATA-path excessive delay (loss)</title>
<desc>Three ARQ protocols compared as the data-path excessive delay (loss) probability rises from 0.0 to 0.5, all other impairment paths held at zero. Source: results/experiments.csv. efficiency = unique_payload_bytes / transmitted_frame_bytes: the unique application payload the receiver accepted and delivered, divided by every DATA-frame byte the sender put on the wire, including retransmissions, the 15-byte header, zero padding, and the FCS. It is a dimensionless ratio in (0, 1]; 1.0 would mean every transmitted byte was useful payload delivered exactly once. ACK traffic is not counted, because the sender measures only what it transmits on the DATA path.</desc>
<rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2933">
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold">Efficiency versus DATA-path excessive delay (loss)</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#5b6670">CRC-16, 46-byte payload, 4096-byte input, window 8, seed 20260831</text>
<line x1="96" y1="352" x2="736" y2="352" stroke="#dde3e8" stroke-width="1"/>
<text x="86" y="356" text-anchor="end" font-size="11" fill="#5b6670">0</text>
